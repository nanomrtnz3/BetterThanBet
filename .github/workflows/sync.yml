name: Actualizar datos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir una actualizacion
        env:
          DEMO_URL: ${{ secrets.DEMO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          base=$(printf '%s' "$DEMO_URL" | sed 's:/*$::')
          curl --fail-with-body --silent --show-error --max-time 90 -X POST "$base/api/sync" -H "Authorization: Bearer $CRON_SECRET"
